[package]
name = "aegis-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Aegis Gateway Contributors"]
description = "Enterprise-Grade Zero-Trust MCP & Skill Gateway with Distributed State, Granular ABAC, and Tamper-Proof Audit"
repository = "https://github.com/aegis-gateway/aegis-gateway"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "gateway", "enterprise", "skills"]
categories = ["development-tools", "network-programming"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
redis = { version = "1.7.1", features = ["tokio-comp", "aio"] }
base64 = "0.23.1"
sha2 = "0.11.0"
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3.12"

[[bin]]
name = "aegis-gateway"
path = "src/main.rs"

[[bin]]
name = "aegis-audit"
path = "src/bin/aegis_audit.rs"
